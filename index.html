<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Tibber | Kobo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}body{padding:3px 7px;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111;width:100%;max-width:768px;overflow-x:hidden}header{display:none}h2{font-size:15px;margin:3px 0 1px}.price{font-size:39px;font-weight:bold;line-height:1.05}.unit{font-size:16px}.sub,.hint{font-size:10px;margin-top:1px}.graph{margin-top:3px;height:165px;border-left:2px solid #111;border-bottom:2px solid #111;position:relative;overflow:hidden}.bars{position:absolute;top:0;bottom:0;left:0;right:0}.bar{position:absolute;bottom:0;background:#777;border:1px solid #fff}.bar.low{background:#ddd;border:1px solid #888}.bar.now{background:#111}.value{position:absolute;font-size:11px;font-weight:bold;text-align:center;white-space:nowrap}.gridline{position:absolute;left:0;right:0;border-top:1px dashed #aaa}.gridline span{position:absolute;right:0;top:-13px;font-size:10px;background:#fff}.axis{position:relative;height:15px;font-size:10px;margin-top:2px}.tick{position:absolute;top:0}.box{min-height:47px;border:2px solid #111;padding:4px;margin-top:3px}.box strong{font-size:13px}.box div{font-size:12px;margin-top:2px}footer{display:none}#error{font-size:12px;margin-top:4px}
/* Older Kobo browsers may ignore height media queries: JS measures visible space. */
html,body{overflow:hidden} .value{font-size:10px} .gridline span{font-size:9px}
</style></head><body>

<div><span class="price" id="price">—</span> <span class="unit">/kWh</span></div><div class="sub" id="currenttime">Gegevens laden…</div>

<h2 id="charttitle">Komende uren · cent/kWh</h2><div class="graph" id="graph"><div class="bars" id="bars"></div></div><div class="axis" id="axis"></div><div class="hint" id="coverage"></div>
<div class="box"><strong>Goedkoopste 3 uur</strong><div id="cheapest">—</div></div>
<footer><div id="updated">Bron: Tibber · Tarieven inclusief belastingen en vergoedingen volgens Tibber API.</div><div id="error"></div></footer>
<script>
var dataset=null;
function pad(n){return (n<10?'0':'')+n}
function clock(s){var m=String(s).match(/T(\d\d):(\d\d)/);return m?m[1]+':'+m[2]:'--:--'}
function euro(n){return '€ '+Number(n).toFixed(3).replace('.',',')}
function cents(n){return String(Math.round(n*100))}
function timeLabel(s){var d=new Date(s);return pad(d.getHours())+':'+pad(d.getMinutes())}
function fitScreen(){
 var graph=document.getElementById('graph'),box=document.getElementsByClassName('box')[0];
 var view=window.innerHeight||document.documentElement.clientHeight||600;
 // Reserve the actual measured space below the chart, including the bottom recommendation.
 var graphTop=graph.getBoundingClientRect?graph.getBoundingClientRect().top:150;
 var remaining=box.offsetHeight+document.getElementById('axis').offsetHeight+document.getElementById('coverage').offsetHeight+20;
 var available=Math.floor(view-graphTop-remaining-12);
 graph.style.height=Math.max(75,Math.min(240,available))+'px';
}
function render(){
 if(!dataset)return;
 var now=new Date(),ms=now.getTime(),all=(dataset.today||[]).concat(dataset.tomorrow||[]),valid=[],i;
 for(i=0;i<all.length;i++)if(typeof all[i].total==='number'&&all[i].startsAt)valid.push(all[i]);
 valid.sort(function(a,b){return new Date(a.startsAt).getTime()-new Date(b.startsAt).getTime()});
 var current=null, entries=[];
 for(i=0;i<valid.length;i++){
  var st=new Date(valid[i].startsAt).getTime();
  var end=i+1<valid.length?new Date(valid[i+1].startsAt).getTime():st+3600000;
  if(st<=ms&&ms<end)current=valid[i];
  if(end>ms&&entries.length<24)entries.push(valid[i]);
 }
 if(!current&&dataset.current){var cs=new Date(dataset.current.startsAt).getTime();if(cs<=ms&&ms<cs+3600000)current=dataset.current}
 document.getElementById('price').innerHTML=current?euro(current.total):'—';
 document.getElementById('currenttime').innerHTML=current?'Huidig uur '+clock(current.startsAt)+'–'+pad(new Date(new Date(current.startsAt).getTime()+3600000).getHours())+':00'+' · inclusief belastingen':'Geen actueel tarief beschikbaar';
 fitScreen();
 var bars=document.getElementById('bars'),axis=document.getElementById('axis'),graph=document.getElementById('graph');
 bars.innerHTML='';axis.innerHTML='';
 var old=graph.getElementsByClassName('gridline');while(old.length)graph.removeChild(old[0]);
 if(!entries.length){document.getElementById('coverage').innerHTML='Geen toekomstige tarieven beschikbaar';document.getElementById('cheapest').innerHTML='—';return}
 var min=999,max=0;for(i=0;i<entries.length;i++){min=Math.min(min,entries[i].total);max=Math.max(max,entries[i].total)}
 // Use absolute pixel coordinates: the Kobo's older browser does not reliably support flexbox.
 var base=0,top=Math.ceil((max+0.04)*10)/10;if(top<0.1)top=0.1;
 var gw=graph.clientWidth-3,gh=graph.clientHeight-3;
 var count=entries.length,step=gw/count,bw=Math.max(3,step-2);
 for(i=1;i<=3;i++){var g=document.createElement('div');g.className='gridline';g.style.bottom=Math.round(gh*i/4)+'px';var lab=document.createElement('span');lab.innerHTML='€ '+(top*i/4).toFixed(2).replace('.',',');g.appendChild(lab);graph.insertBefore(g,bars)}
 for(i=0;i<count;i++){
  var h=Math.max(2,Math.round(gh*entries[i].total/top));
  var x=Math.round(i*step+1);
  var bar=document.createElement('div');bar.className='bar'+(entries[i].total<=min+0.01?' low':'')+(i===0?' now':'');
  bar.style.left=x+'px';bar.style.width=Math.round(bw)+'px';bar.style.height=h+'px';
  bar.title=timeLabel(entries[i].startsAt)+' '+euro(entries[i].total);bars.appendChild(bar);
  var label=document.createElement('div');label.className='value';label.style.left=x+'px';label.style.width=Math.round(bw)+'px';
  label.style.bottom=Math.min(gh-16,h+4)+'px';label.innerHTML=cents(entries[i].total);bars.appendChild(label);
 }
 for(i=0;i<count;i+=Math.max(1,Math.ceil(count/8))){var t=document.createElement('span');t.className='tick';t.style.left=Math.round(i*step)+'px';t.innerHTML=timeLabel(entries[i].startsAt);axis.appendChild(t)}
 document.getElementById('coverage').innerHTML='Vanaf '+timeLabel(entries[0].startsAt)+' · '+entries.length+' uur vooruit'+(entries.length<24?' (verdere prijzen nog niet beschikbaar)':'');
 var best=null;
 for(i=0;i+2<entries.length;i++){
  var t0=new Date(entries[i].startsAt).getTime(),t1=new Date(entries[i+1].startsAt).getTime(),t2=new Date(entries[i+2].startsAt).getTime();
  if(t1-t0!==3600000||t2-t1!==3600000)continue;
  var avg=(entries[i].total+entries[i+1].total+entries[i+2].total)/3;
  if(!best||avg<best.avg)best={i:i,avg:avg};
 }
 if(best){var finish=new Date(new Date(entries[best.i+2].startsAt).getTime()+3600000);document.getElementById('cheapest').innerHTML=timeLabel(entries[best.i].startsAt)+'–'+pad(finish.getHours())+':'+pad(finish.getMinutes())+' · gemiddeld '+euro(best.avg)+'/kWh'}
 else document.getElementById('cheapest').innerHTML='Nog geen 3 aaneengesloten uren beschikbaar';
}
function load(){var x=new XMLHttpRequest();x.open('GET','prices.json?t='+new Date().getTime(),true);x.onreadystatechange=function(){if(x.readyState===4){if(x.status===200||x.status===0){try{var d=JSON.parse(x.responseText);if(!d.today||!d.tomorrow)throw Error('Onbekend gegevensformaat');dataset=d;document.getElementById('error').innerHTML='';render();document.getElementById('updated').innerHTML='Bron: Tibber · Gegevens opgehaald '+pad(new Date().getHours())+':'+pad(new Date().getMinutes())+' · Inclusief belastingen en vergoedingen.'}catch(e){document.getElementById('error').innerHTML='Kan prijsgegevens niet verwerken: '+e.message}}else document.getElementById('error').innerHTML='Kan prices.json niet laden (HTTP '+x.status+').'}};x.send()}
load();setInterval(load,15*60*1000);setInterval(render,60*1000);window.onresize=render;
</script></body></html>
