name: Test EpexPredictor

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Nederlandse prijsvoorspellingen
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          url = "https://epexpredictor.batzill.com/prices_short?region=NL"

          print("=== EpexPredictor API-test ===")

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "KoboEnergyDashboard/1.0"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          timestamps = data["s"]
          prices = data["t"]

          assert len(timestamps) == len(prices), "Aantal tijdstippen en prijzen verschilt"
          assert len(timestamps) > 0, "Geen prijsgegevens ontvangen"

          print("VERBINDING GESLAAGD")
          print(f"Aantal prijsgegevens: {len(prices)}")

          timezone = ZoneInfo("Europe/Amsterdam")
          now = datetime.now(timezone)
          day_after_tomorrow = now.date() + timedelta(days=2)

          dates = [
              datetime.fromtimestamp(ts, timezone).date()
              for ts in timestamps
          ]

          print(f"Eerste tijdstip: {datetime.fromtimestamp(timestamps[0], timezone)}")
          print(f"Laatste tijdstip: {datetime.fromtimestamp(timestamps[-1], timezone)}")
          print(f"Eerste prijswaarde: {prices[0]}")
          print(f"Laatste prijswaarde: {prices[-1]}")

          count = sum(
              1 for date in dates
              if date == day_after_tomorrow
          )

          print(f"Prijsgegevens voor overmorgen ({day_after_tomorrow}): {count}")

          if count > 0:
              print("OVERMORGEN: GEGEVENS BESCHIKBAAR")
          else:
              print("OVERMORGEN: GEEN GEGEVENS")

          intervals = [
              timestamps[i + 1] - timestamps[i]
              for i in range(len(timestamps) - 1)
          ]

          print(f"Tijdstap in seconden: {sorted(set(intervals))}")

          assert count > 0, "Geen prijsgegevens voor overmorgen"

          print("=== TEST GESLAAGD ===")
          PY
