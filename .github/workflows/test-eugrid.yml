name: Test EU Grid Model

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Nederlandse prijsvoorspellingen
        env:
          API_KEY: ${{ secrets.EUGRIDMODEL_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          url = "https://eugridmodel.com/v1/forecast/NL"
          key = os.environ["API_KEY"]

          print("EU Grid Model API testen...")
          print("Land: Nederland (NL)")

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {key}",
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)

              print("VERBINDING GESLAAGD")
              print("Ontvangen gegevens:")
              print(json.dumps(data, indent=2)[:5000])

          except urllib.error.HTTPError as e:
              print(f"HTTP-fout: {e.code}")
              print(e.read().decode()[:1000])
              raise

          except Exception as e:
              print(f"FOUT: {e}")
              raise
          PY
