name: Update Tibber prices
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices from Tibber
        env:
          TIBBER_TOKEN: ${{ secrets.TIBBER_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          query = '''{ viewer { homes { id currentSubscription { priceInfo { current { total startsAt } today { total startsAt } tomorrow { total startsAt } } } } } }'''
          request = urllib.request.Request(
              'https://api.tibber.com/v1-beta/gql',
              data=json.dumps({'query': query}).encode('utf-8'),
              headers={'Authorization': 'Bearer ' + os.environ['TIBBER_TOKEN'], 'Content-Type': 'application/json'},
              method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          if result.get('errors'):
              raise RuntimeError('Tibber API returned errors: ' + json.dumps(result['errors']))
          homes = result.get('data', {}).get('viewer', {}).get('homes', [])
          subscriptions = [h['currentSubscription'] for h in homes if h.get('currentSubscription') and h['currentSubscription'].get('priceInfo')]
          if len(subscriptions) != 1:
              raise RuntimeError('Expected exactly one home with Tibber price data; found ' + str(len(subscriptions)))
          info = subscriptions[0]['priceInfo']
          print('Tibber tarieven vandaag:', len(info.get('today') or []))
          print('Tibber tarieven morgen:', len(info.get('tomorrow') or []))
          if not info.get('today') or not info.get('current'):
              raise RuntimeError('No current or today price data available')
          with open('prices.json', 'w', encoding='utf-8') as file:
              json.dump({'current': info['current'], 'today': info['today'], 'tomorrow': info.get('tomorrow') or []}, file, ensure_ascii=False, indent=2)
          PY
      - name: Publish updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Tibber prices"
            git push
          fi

