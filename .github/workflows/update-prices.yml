name: Update Tibber prices

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: tibber-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Tibber prices and EpexPredictor forecasts
        env:
          TIBBER_TOKEN: ${{ secrets.TIBBER_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import math
          import statistics
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Europe/Amsterdam")

          def get_json(request):
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def parse_date(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          def iso(dt):
              return dt.isoformat(timespec="seconds")

          # --------------------------------------------------
          # 1. Definitieve Tibber-prijzen ophalen
          # --------------------------------------------------

          query = '''
          {
            viewer {
              homes {
                id
                currentSubscription {
                  priceInfo {
                    current { total startsAt }
                    today { total startsAt }
                    tomorrow { total startsAt }
                  }
                }
              }
            }
          }
          '''

          request = urllib.request.Request(
              "https://api.tibber.com/v1-beta/gql",
              data=json.dumps({"query": query}).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["TIBBER_TOKEN"],
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          result = get_json(request)

          if result.get("errors"):
              raise RuntimeError("Tibber API: " + json.dumps(result["errors"]))

          homes = result.get("data", {}).get("viewer", {}).get("homes", [])

          subscriptions = [
              h["currentSubscription"]
              for h in homes
              if h.get("currentSubscription")
              and h["currentSubscription"].get("priceInfo")
          ]

          if len(subscriptions) != 1:
              raise RuntimeError("Verwacht precies één Tibber-aansluiting")

          info = subscriptions[0]["priceInfo"]

          if not info.get("today") or not info.get("current"):
              raise RuntimeError("Geen actuele Tibber-prijzen ontvangen")

          actual = info["today"] + (info.get("tomorrow") or [])

          print("Tibber vandaag:", len(info["today"]), "uur")
          print("Tibber morgen:", len(info.get("tomorrow") or []), "uur")

          output = {
              "current": info["current"],
              "today": info["today"],
              "tomorrow": info.get("tomorrow") or [],
              "forecast": [],
              "forecast_adjustment": None,
              "forecast_updated_at": None
          }

          # --------------------------------------------------
          # 2. EpexPredictor ophalen
          # --------------------------------------------------

          try:
              url = (
                  "https://epexpredictor.batzill.com/prices_short"
                  "?region=NL"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "KoboEnergyDashboard/1.0"
                  }
              )

              data = get_json(request)

              timestamps = data["s"]
              prices = data["t"]

              if len(timestamps) != len(prices) or not timestamps:
                  raise ValueError("Ongeldige EpexPredictor-gegevens")

              # EpexPredictor /prices_short geeft prijzen
              # in eurocent per kWh terug.
              # Omrekenen naar EUR/kWh.
              quarter_prices = {}

              for ts, price in zip(timestamps, prices):
                  if not isinstance(price, (int, float)):
                      continue
                  if not math.isfinite(price):
                      continue

                  ts = int(ts)

                  if ts % 900 != 0:
                      continue

                  quarter_prices[ts] = price / 100.0

              if not quarter_prices:
                  raise ValueError("Geen geldige kwartierprijzen")

              print("EpexPredictor kwartieren:", len(quarter_prices))

              # --------------------------------------------------
              # 3. Kwartierprijzen naar uurprijzen
              # --------------------------------------------------

              market_hours = {}

              first_hour = min(quarter_prices) // 3600 * 3600
              last_hour = max(quarter_prices) // 3600 * 3600

              for hour in range(first_hour, last_hour + 1, 3600):
                  values = [
                      quarter_prices.get(hour + i * 900)
                      for i in range(4)
                  ]

                  if any(v is None for v in values):
                      continue

                  market_hours[hour] = sum(values) / 4

              print("Complete markturen:", len(market_hours))

              if not market_hours:
                  raise ValueError("Geen complete markturen")

              # --------------------------------------------------
              # 4. Correctie bepalen met echte Tibber-prijzen
              # --------------------------------------------------

              # De marktprijs wordt met 21% btw verhoogd.
              # De resterende correctie wordt afgeleid uit
              # de beschikbare Tibber-tarieven.

              differences = []

              for item in actual:
                  start = parse_date(item["startsAt"])
                  hour = int(start.timestamp())

                  market = market_hours.get(hour)

                  if market is None:
                      continue

                  tibber_total = item.get("total")

                  if not isinstance(tibber_total, (int, float)):
                      continue

                  differences.append(
                      tibber_total - market * 1.21
                  )

              if len(differences) < 3:
                  raise ValueError(
                      "Onvoldoende overeenkomende Tibber- en marktprijzen"
                  )

              adjustment = statistics.median(differences)

              # Bescherming tegen een onrealistische correctie.
              if not 0.05 <= adjustment <= 0.25:
                  raise ValueError(
                      "Onverwachte prijscorrectie: " + str(adjustment)
                  )

              print("Vergelijkbare uren:", len(differences))
              print("Correctie EUR/kWh:", round(adjustment, 6))

              output["forecast_adjustment"] = round(adjustment, 6)
              output["forecast_updated_at"] = datetime.now(
                  timezone.utc
              ).isoformat()

              # --------------------------------------------------
              # 5. Voorspelde Tibber-tarieven samenstellen
              # --------------------------------------------------

              now = datetime.now(timezone.utc)
              max_time = now + timedelta(days=4)

              for hour, market in sorted(market_hours.items()):
                  start = datetime.fromtimestamp(hour, timezone.utc)
                  end = start + timedelta(hours=1)

                  if end <= now or start >= max_time:
                      continue

                  # Definitieve Tibber-uren niet voorspellen.
                  # De website geeft sowieso voorrang aan actual.
                  if any(
                      int(parse_date(item["startsAt"]).timestamp()) == hour
                      for item in actual
                  ):
                      continue

                  estimated_total = market * 1.21 + adjustment

                  output["forecast"].append({
                      "start": iso(start),
                      "end": iso(end),
                      "total": round(estimated_total, 6),
                      "market": round(market, 6)
                  })

              print("Voorspelde uurprijzen:", len(output["forecast"]))

              if not output["forecast"]:
                  raise ValueError("Geen toekomstige voorspellingen")

              print("EpexPredictor: GESLAAGD")

          except Exception as error:
              print("WAARSCHUWING: EpexPredictor:", str(error))

              # Bij een tijdelijke storing oude voorspellingen
              # bewaren, maar alleen voor toekomstige uren.
              try:
                  with open("prices.json", encoding="utf-8") as f:
                      previous = json.load(f)

                  now = datetime.now(timezone.utc)

                  output["forecast"] = [
                      item
                      for item in previous.get("forecast", [])
                      if parse_date(item["end"]) > now
                  ]

                  output["forecast_adjustment"] = previous.get(
                      "forecast_adjustment"
                  )

                  output["forecast_updated_at"] = previous.get(
                      "forecast_updated_at"
                  )

                  print(
                      "Eerder opgeslagen voorspellingen:",
                      len(output["forecast"])
                  )

              except Exception as fallback_error:
                  print("Geen bruikbare reserve:", fallback_error)

          # --------------------------------------------------
          # 6. Gegevens publiceren
          # --------------------------------------------------

          with open("prices.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("prices.json bijgewerkt")
          PY

      - name: Publish updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Tibber prices and forecasts"
            git pull --rebase origin main
            git push origin main
          fi
